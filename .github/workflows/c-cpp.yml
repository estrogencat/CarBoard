name: Build and release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build tweak
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make xz

      - name: Set up Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Get the iOS 16.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-src
          git -C sdks-src sparse-checkout set iPhoneOS16.5.sdk
          mv sdks-src/iPhoneOS16.5.sdk "$THEOS/sdks/"
          rm -rf sdks-src

      # Xcode's clang, ad-hoc codesign: the only combination iOS 18's arm64e SpringBoard loads
      - name: Build package
        run: |
          gmake package FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)" TARGET_CODESIGN=codesign TARGET_CODESIGN_FLAGS="-f -s -"
          ls packages

      - name: Check arm64e ABI
        run: |
          for f in .theos/obj/carboard.dylib .theos/obj/carboardprefs.bundle/carboardprefs; do
            otool -hv -arch arm64e "$f" | grep -q USR00 || { echo "$f is not new-ABI arm64e"; exit 1; }
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB=$(ls -t packages/*.deb | head -n1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            FLAGS=""
          else
            TAG="build-${GITHUB_SHA::7}"
            FLAGS="--prerelease"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --target "$GITHUB_SHA" --title "$TAG" --generate-notes $FLAGS
          fi
